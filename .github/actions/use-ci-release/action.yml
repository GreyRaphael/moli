name: Use CI release
description: Download and verify a release binary built by this workflow.

inputs:
  side:
    description: Release side to consume (head or base).
    required: true
  revision:
    description: Exact Git revision expected in the artifact.
    required: true

runs:
  using: composite
  steps:
    - name: Download release artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: moli-release-${{ inputs.side }}
        path: target/ci-artifacts/${{ inputs.side }}
    - name: Verify release artifact
      shell: bash
      env:
        RELEASE_SIDE: ${{ inputs.side }}
        EXPECTED_REVISION: ${{ inputs.revision }}
      run: .github/scripts/unpack-ci-release.sh "$RELEASE_SIDE" "$EXPECTED_REVISION"
